{% extends "admin/base_admin.html" %}

{% block title %}Nouvelle catégorie{% endblock %}

{% block content %}
<h1>Nouvelle catégorie</h1>

<form method="POST" enctype="multipart/form-data" class="admin-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <label for="nom">Nom</label>
  <input type="text" id="nom" name="nom" required>

  <label for="ordre">Ordre d'affichage</label>
  <input type="number" id="ordre" name="ordre" value="0">

  <label for="categorie_principale_id">Catégorie principale (optionnel)</label>
  <select id="categorie_principale_id" name="categorie_principale_id">
    <option value="">Aucune</option>
    {% for principale in categories_principales %}
    <option value="{{ principale.id }}">{{ principale.nom }}</option>
    {% endfor %}
  </select>

  <label for="image">Image</label>
  <div class="champ-fichier">
    <input type="file" id="image" name="image" accept="image/*">
    <button type="button" class="btn-effacer-fichier" data-cible="image">✕ Retirer</button>
  </div>

  <button type="submit">Créer la catégorie</button>

</form>

<script>
document.querySelectorAll('.btn-effacer-fichier').forEach(function (btn) {
  btn.addEventListener('click', function () {
    document.getElementById(btn.dataset.cible).value = '';
  });
});
</script>
{% endblock %}
